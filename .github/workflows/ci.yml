name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run node tests
        run: npm test

  python-tests:
    name: Python 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest tests/python -q

  build-exe:
    name: 桌面版 exe 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop exe
        shell: powershell
        run: .\scripts\build-desktop.ps1
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: WXBOT-win-x64
          path: WXBOT.exe
          if-no-files-found: error

